<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 | Browser Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--panel:#171728;--line:#2a2a45;--text:#e8e8f5;--muted:#8b8ba8;--neon:#ffd166}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
h1{font-size:28px;letter-spacing:.15em;color:var(--neon);margin-bottom:8px;text-shadow:0 0 20px rgba(255,209,102,.4)}
.top{display:flex;gap:24px;margin-bottom:16px;width:min(90vw,420px);justify-content:space-between;align-items:center}
.score,.best{font-family:"Consolas",monospace;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 16px;text-align:center;font-size:13px;color:var(--muted);min-width:96px}
.score b,.best b{display:block;font-size:22px;color:var(--neon);margin-top:2px}
.best b{color:var(--text)}
#grid{position:relative;width:min(90vw,420px);height:min(90vw,420px);background:var(--panel);border:2px solid var(--neon);border-radius:12px;box-shadow:0 0 40px -8px rgba(255,209,102,.3);padding:10px}
#cells{position:absolute;inset:10px}
.tile{position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:"Consolas",monospace;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.3);transition:all .12s ease;box-shadow:0 0 14px -4px rgba(0,0,0,.5)}
.btn-game{margin-top:16px;font-family:"Consolas",monospace;font-size:15px;letter-spacing:.15em;padding:12px 28px;background:transparent;border:2px solid var(--neon);color:var(--neon);border-radius:8px;cursor:pointer;transition:.2s}
.btn-game:hover{background:var(--neon);color:var(--bg);box-shadow:0 0 24px rgba(255,209,102,.4)}
.controls{margin-top:12px;font-size:13px;color:var(--muted)}
.controls kbd{font-family:"Consolas",monospace;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--text);font-size:11px}
#msg{position:absolute;inset:0;background:rgba(10,10,20,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:10px;z-index:5}
#msg.show{display:flex}
#msg h2{font-size:34px;color:var(--neon);text-shadow:0 0 24px rgba(255,209,102,.5)}
#msg p{color:var(--muted);font-size:15px}
#msg button{font-family:"Consolas",monospace;font-size:15px;letter-spacing:.15em;padding:12px 26px;background:transparent;border:2px solid var(--neon);color:var(--neon);border-radius:8px;cursor:pointer;margin-top:6px}
#msg button:hover{background:var(--neon);color:var(--bg)}
</style>
</head>
<body>
<h1>2048</h1>
<div class="top">
  <div class="score">SCORE<b id="score">0</b></div>
  <div class="best">BEST<b id="best">0</b></div>
</div>
<div id="grid">
  <div id="cells"></div>
  <div id="msg">
    <h2 id="ovTitle">GAME OVER</h2>
    <p id="ovSub"></p>
    <button id="tryagain">PLAY AGAIN</button>
  </div>
</div>
<button class="btn-game" id="newbtn">NEW GAME</button>
<div class="controls">Arrows or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move &middot; swipe on mobile</div>
<script>
const TARGET=2048;
const COLORS={
  2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',
  128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'
};
const DARK={2:'#776e65',4:'#776e65'};
const cellsEl=document.getElementById('cells');
let board,score,best,over,won,size=4,gap;

function loadBest(){return parseInt(localStorage.getItem('game2048_best')||'0',10)}
function saveBest(v){localStorage.setItem('game2048_best',v)}

function layout(){
  const w=cellsEl.clientWidth,h=cellsEl.clientHeight;
  gap=10;
  return{w,h,tile:(w-gap*(size+1))/size};
}
function init(){
  board=Array(size*size).fill(0);score=0;over=false;won=false;
  best=Math.max(best||0,loadBest());
  document.getElementById('best').textContent=best;
  document.getElementById('msg').classList.remove('show');
  addTile();addTile();render();
}
function pos(i){return{x:i%size,y:Math.floor(i/size)}}
function idx(x,y){return y*size+x}
function emptyCells(){const r=[];for(let i=0;i<size*size;i++)if(board[i]===0)r.push(i);return r}
function addTile(){
  const cells=emptyCells();if(!cells.length)return;
  const i=cells[Math.floor(Math.random()*cells.length)];
  board[i]=Math.random()<0.9?2:4;
}
function render(){
  document.getElementById('score').textContent=score;
  const L=layout();
  cellsEl.querySelectorAll('.tile').forEach(t=>t.remove());
  for(let i=0;i<size*size;i++){
    const v=board[i];if(!v)continue;
    const {x,y}=pos(i);
    const d=document.createElement('div');
    d.className='tile';
    d.style.width=(L.tile)+'px';d.style.height=(L.tile)+'px';
    d.style.left=(x*(L.tile+gap)+gap)+'px';
    d.style.top=(y*(L.tile+gap)+gap)+'px';
    d.style.fontSize=v>=1024?(L.tile*0.38)+'px':v>=128?(L.tile*0.45)+'px':(L.tile*0.55)+'px';
    d.textContent=v;
    d.style.background=COLORS[v]||'#ff2d95';
    d.style.color=(DARK[v]!==undefined)?DARK[v]:'#f9f6f2';
    cellsEl.appendChild(d);
  }
}
function lineSlide(line){
  const nz=line.filter(v=>v!==0);
  const out=[];let gained=0;
  for(let i=0;i<nz.length;i++){
    if(nz[i]===nz[i+1]){out.push(nz[i]*2);gained+=nz[i]*2;i++}
    else out.push(nz[i]);
  }
  while(out.length<size)out.push(0);
  return{out,gained};
}
function move(dir){
  if(over)return;
  let g=0,moved=false;
  const build=dir==='left'||dir==='right'
    ?(r)=>Array.from({length:size},(_,c)=>board[idx(c,r)])
    :(r)=>Array.from({length:size},(_,c)=>board[idx(r,c)]);
  const place=dir==='left'||dir==='right'
    ?(r,vals)=>vals.forEach((v,c)=>board[idx(c,r)]=v)
    :(r,vals)=>vals.forEach((v,c)=>board[idx(r,c)]=v);
  for(let r=0;r<size;r++){
    let line=build(r);
    if(dir==='right'||dir==='down')line=line.reverse();
    const res=lineSlide(line);
    let out=res.out;
    if(dir==='right'||dir==='down')out=out.reverse();
    const before=build(r).join(','),after=out.join(',');
    if(before!==after)moved=true;
    place(r,out);
    g+=res.gained;
  }
  if(moved){
    score+=g;
    addTile();
    if(best<score){best=score;saveBest(best);document.getElementById('best').textContent=best}
    render();
    if(board.some(v=>v===TARGET)&&!won){
      won=true;
      showMsg('YOU WIN!','Score '+score+' &middot; keep going or restart');
    }else if(!hasMoves()){
      over=true;
      if(best<score){best=score;saveBest(best);document.getElementById('best').textContent=best}
      showMsg('GAME OVER','Score '+score+' &middot; Best '+best);
    }
  }
}
function hasMoves(){
  if(emptyCells().length)return true;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const v=board[idx(x,y)];
    if(x<size-1&&board[idx(x+1,y)]===v)return true;
    if(y<size-1&&board[idx(x,y+1)]===v)return true;
  }
  return false;
}
function showMsg(t,s){
  document.getElementById('ovTitle').textContent=t;
  document.getElementById('ovSub').innerHTML=s;
  document.getElementById('msg').classList.add('show');
}
document.addEventListener('keydown',e=>{
  const k=e.key;
  const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};
  const m=map[k.toLowerCase()]||map[k];
  if(!m)return;
  e.preventDefault();move(m);
});
let ts=null;
window.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
window.addEventListener('touchend',e=>{
  if(!ts)return;
  const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;
  ts=null;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
});
document.getElementById('tryagain').addEventListener('click',init);
document.getElementById('newbtn').addEventListener('click',init);
window.addEventListener('resize',render);
best=loadBest();init();
</script>
</body>
</html>
